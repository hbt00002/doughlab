<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoughLab</title>
  <meta name="description" content="Oyun hamuruyla veri geometrisi: 3B hamur şekilleri yap, onlardan nokta bulutu (veri seti) üret.">
  <link rel="preload" href="fonts/Lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=42d1325dc9">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "./src/analysis-ui.js": "./src/analysis-ui.js?v=42d1325dc9",
        "./src/analysis.js": "./src/analysis.js?v=42d1325dc9",
        "./src/arrows.js": "./src/arrows.js?v=42d1325dc9",
        "./src/autosave.js": "./src/autosave.js?v=42d1325dc9",
        "./src/geometry.js": "./src/geometry.js?v=42d1325dc9",
        "./src/ghost-data.js": "./src/ghost-data.js?v=42d1325dc9",
        "./src/ghost-ui.js": "./src/ghost-ui.js?v=42d1325dc9",
        "./src/ghost.js": "./src/ghost.js?v=42d1325dc9",
        "./src/history-ui.js": "./src/history-ui.js?v=42d1325dc9",
        "./src/history.js": "./src/history.js?v=42d1325dc9",
        "./src/i18n.js": "./src/i18n.js?v=42d1325dc9",
        "./src/icons.js": "./src/icons.js?v=42d1325dc9",
        "./src/main.js": "./src/main.js?v=42d1325dc9",
        "./src/panels.js": "./src/panels.js?v=42d1325dc9",
        "./src/pieces.js": "./src/pieces.js?v=42d1325dc9",
        "./src/sampling.js": "./src/sampling.js?v=42d1325dc9",
        "./src/scene.js": "./src/scene.js?v=42d1325dc9",
        "./src/selection.js": "./src/selection.js?v=42d1325dc9",
        "./src/share.js": "./src/share.js?v=42d1325dc9",
        "./src/state.js": "./src/state.js?v=42d1325dc9",
        "./src/storage.js": "./src/storage.js?v=42d1325dc9",
        "./src/theme.js": "./src/theme.js?v=42d1325dc9",
        "./src/ui.js": "./src/ui.js?v=42d1325dc9"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>DoughLab</h1>
      <p data-i18n="brand.tagline">Oyun hamuruyla veri geometrisi</p>
    </div>
    <div class="topbar-actions">
      <button id="btn-undo" data-icon="undo" disabled><span class="label" data-i18n="top.undo">Geri al</span></button>
      <button id="btn-redo" data-icon="redo" disabled><span class="label" data-i18n="top.redo">Yinele</span></button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-share" data-icon="share"><span class="label" data-i18n="top.share">Paylaş</span></button>
      <button id="theme-toggle" class="secondary" data-icon="auto"><span class="label" id="theme-label"></span></button>
      <button id="lang-toggle" class="secondary" data-icon="language" data-i18n-title="lang.switch"><span class="label" id="lang-label">EN</span></button>
      <div id="more-wrap">
        <button id="more-toggle" data-icon="more" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu"><span class="visually-hidden" data-i18n="top.more">Diğer</span></button>
        <div class="more-menu" id="more-menu" hidden>
          <button id="more-theme" data-icon="auto"><span id="more-theme-label"></span></button>
          <button id="more-lang" data-icon="language"><span data-i18n="lang.switch"></span></button>
        </div>
      </div>
    </div>
  </header>

  <aside class="sidebar">

    <section class="panel">
      <h2 data-i18n="panel.add">Hamur ekle</h2>
      <div class="shape-buttons" id="shape-buttons">
        <button data-shape="ball" data-icon="ball"><span data-i18n="shape.ball">Top</span></button>
        <button data-shape="snake" data-icon="snake"><span data-i18n="shape.snake">Yılan</span></button>
        <button data-shape="slab" data-icon="slab"><span data-i18n="shape.slab">Levha</span></button>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="panel.ghost">Hayalet veri</h2>
      <p class="hint" data-i18n="ghost.hint"></p>
      <div class="btn-row">
        <button id="ghost-load" data-i18n="ghost.load">CSV yükle</button>
        <button id="ghost-gapminder" data-i18n="ghost.gapminder">Gapminder örneği</button>
      </div>
      <input type="file" id="ghost-file" accept=".csv,.tsv,.txt,text/csv" hidden>
      <div id="ghost-settings"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="panel.pieces">Parçalar</h2>
      <div id="piece-list" class="piece-list"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="panel.selected">Seçili parça</h2>
      <div id="props"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="panel.data">Veri</h2>
      <div class="field">
        <span class="field-head" data-i18n="data.view">Görünüm</span>
        <div class="segmented" id="view-mode">
          <button data-view="dough" class="active" data-i18n="view.dough">Hamur</button>
          <button data-view="both" data-i18n="view.both">Hamur + nokta</button>
          <button data-view="points" data-i18n="view.points">Nokta</button>
        </div>
      </div>
      <label class="field">
        <span class="field-head"><span data-i18n="data.density">Nokta yoğunluğu</span> <output id="density-value">60</output></span>
        <input id="density" type="range" min="5" max="300" step="5" value="60">
      </label>
      <p class="hint" data-i18n="data.hint"></p>
      <div class="btn-row">
        <button id="btn-export" class="primary" data-i18n="data.export">CSV indir</button>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="panel.scene">Sahne</h2>
      <div class="btn-row">
        <button id="btn-example" data-i18n="scene.example">Örnek sahne</button>
        <button id="btn-save" data-i18n="scene.save">Kaydet</button>
        <button id="btn-load" data-i18n="scene.open">Aç</button>
        <button id="btn-clear" class="danger" data-i18n="scene.clear">Temizle</button>
      </div>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </section>
  </aside>

  <main class="stage">
    <div id="viewport"></div>
    <div class="toolbar" id="toolbar">
      <div class="toolbar-group" id="mode-buttons">
        <button data-mode="translate" class="active" data-icon="move"><span data-i18n="mode.translate">Taşı</span></button>
        <button data-mode="rotate" data-icon="rotate"><span data-i18n="mode.rotate">Döndür</span></button>
        <button data-mode="scale" data-icon="scale"><span data-i18n="mode.scale">Ölçekle</span></button>
      </div>
      <div class="toolbar-group">
        <button id="tool-duplicate" data-icon="duplicate" disabled><span data-i18n="tool.duplicate">Çoğalt</span></button>
        <button id="tool-delete" class="danger" data-icon="delete" disabled><span data-i18n="tool.delete">Sil</span></button>
      </div>
    </div>
    <aside class="analysis" id="analysis">
      <header class="analysis-head">
        <h2 data-i18n="analysis.title">Analiz</h2>
        <button id="analysis-toggle" data-i18n-title="analysis.toggle">Gizle</button>
      </header>
      <div class="analysis-body" id="analysis-body">
        <div class="tabs" id="analysis-tabs" role="tablist">
          <button data-tab="pca" class="active" role="tab" data-i18n="tab.pca">PCA</button>
          <button data-tab="regression" role="tab" data-i18n="tab.regression">Regresyon</button>
          <button data-tab="shadow" role="tab" data-i18n="tab.shadow">Gölge</button>
        </div>
        <div class="segmented" id="analysis-scope">
          <button data-scope="all" class="active" data-i18n="scope.all">Tüm parçalar</button>
          <button data-scope="selected" data-i18n="scope.selected">Seçili parça</button>
        </div>

        <div class="tab-pane" data-pane="pca">
          <div id="analysis-content"></div>
        </div>

        <div class="tab-pane" data-pane="regression" hidden>
          <label class="field">
            <span class="field-head" data-i18n="reg.target">Hedef (bağımlı) eksen</span>
            <select id="reg-target">
              <option value="1">y ← x, z</option>
              <option value="0">x ← y, z</option>
              <option value="2">z ← x, y</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="reg-plane" checked> <span data-i18n="reg.showPlane">Regresyon düzlemini sahnede göster</span></label>
          <div id="regression-content"></div>
        </div>

        <div class="tab-pane" data-pane="shadow" hidden>
          <p class="note" data-i18n="shadow.intro"></p>
          <label class="field">
            <span class="field-head"><span data-i18n="shadow.azimuth">Işık yönü</span> <output id="shadow-azimuth-value"></output></span>
            <input id="shadow-azimuth" type="range" min="0" max="360" step="1" value="35">
          </label>
          <label class="field">
            <span class="field-head"><span data-i18n="shadow.elevation">Işık yüksekliği</span> <output id="shadow-elevation-value"></output></span>
            <input id="shadow-elevation" type="range" min="-89" max="89" step="1" value="55">
          </label>
          <div class="btn-row">
            <button id="shadow-align" class="primary" data-i18n="shadow.align">PCA gölgesine hizala</button>
            <button id="shadow-worst" data-i18n="shadow.worst">En kötü gölge</button>
          </div>
          <div id="shadow-content"></div>
        </div>
      </div>
    </aside>
    <section class="empty-card" id="empty-card" aria-labelledby="empty-title" hidden>
      <h2 id="empty-title" data-i18n="empty.title">Hamurla veri şekillendir</h2>
      <p data-i18n="empty.text"></p>
      <div class="empty-actions">
        <button id="empty-ball" class="primary" data-icon="ball"><span data-i18n="empty.addBall">Top ekle</span></button>
        <button id="empty-gapminder" data-icon="language"><span data-i18n="empty.gapminder">Gapminder verisini yükle</span></button>
        <button id="empty-example" data-icon="slab"><span data-i18n="empty.example">Örnek sahneyi aç</span></button>
      </div>
      <p class="hint" data-i18n="empty.hint"></p>
    </section>
    <div class="marquee" id="marquee" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="tooltip" id="tooltip" hidden></div>
    <div class="status" id="status"></div>
    <div class="help" id="help"></div>
  </main>

  <script type="module" src="src/main.js?v=42d1325dc9"></script>
</body>
</html>
